<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml" />
    <title>拼豆图纸生成器 · vibe</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <a href="../../">VIBE</a>
      <div><h1>拼豆图纸</h1><p>BEAD LAB · 把喜欢的图片变成可以照着拼的图纸</p></div>
      <span id="dimensions">32 × 32</span>
    </header>

    <main>
      <section class="toolbar" aria-label="图纸设置">
        <label class="upload">＋ 上传图片<input id="file" type="file" accept="image/*" /></label>
        <label class="range"><span>尺寸 <output id="size-out">32</output></span><input id="size" type="range" min="12" max="64" value="32" /></label>
        <label class="range"><span>颜色 <output id="colors-out">12</output></span><input id="colors" type="range" min="4" max="24" value="12" /></label>
        <label class="check"><input id="codes" type="checkbox" /> 显示色号</label>
        <div class="actions"><button id="print">打印</button><button id="download">下载图纸</button></div>
      </section>

      <div class="content">
        <section class="workspace" id="dropzone">
          <div class="sheet"><canvas id="pattern" aria-label="可编辑的拼豆图纸"></canvas></div>
          <p id="tip">拖入图片，或选择右侧颜色后点击图纸修正</p>
        </section>

        <aside class="materials">
          <div class="materials-title"><div><p>豆豆盒</p><small>选一种颜色，直接在图纸上画</small></div><b id="total">0 颗</b></div>
          <button class="eraser" id="eraser">橡皮 · 留空</button>
          <div id="swatches"></div>
        </aside>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
