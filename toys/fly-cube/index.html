<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>候风地动仪 · vibe</title>
<meta name="description" content="vibe：让课本里的候风地动仪动起来。">
<link rel="icon" href="../../assets/logo.svg"><link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="../../src/shared/series.css" />
</head>
<body>
<main>
<header><a href="../../" class="series-home" aria-label="返回 vibe 合集">vibe</a><h1>候风地动仪</h1></header>
<div id="stage" aria-label="可旋转的地动仪三维场景"></div>
<div id="error" role="alert" hidden></div>
<section class="controls" aria-label="地动仪操作">
<p id="status" aria-live="polite">静候地动</p>
<div class="actions">
<select id="direction" aria-label="来震方向"><option value="0">北方</option><option value="1">东北方</option><option value="2">东方</option><option value="3" selected>东南方</option><option value="4">南方</option><option value="5">西南方</option><option value="6">西方</option><option value="7">西北方</option></select>
<button id="strike" class="primary">震一下</button>
<button id="pause" aria-pressed="false">慢动作</button>
<label class="cutaway"><input id="cutaway" type="checkbox">透视</label>
<button id="view" aria-label="恢复默认视角">重置视角</button>
</div>
</section>
<footer><span>拖动旋转 · 滚轮缩放</span><span>复原造型 · 机构示意</span></footer>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
