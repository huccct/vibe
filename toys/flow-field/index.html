<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml" />
    <script src="../../src/shared/theme.js"></script>
    <title>flow field — vibe</title>
    <link rel="stylesheet" href="../../src/shared/vibe.css" />
  </head>
  <body>
    <div class="toy-shell">
      <div class="toy-bar">
        <a class="back" href="../../">← vibe</a>
        <h1>flow field</h1>

        <label class="ctrl">
          粒子
          <input id="n" type="range" min="200" max="4000" step="100" value="1600" />
          <output id="nOut">1600</output>
        </label>

        <label class="ctrl">
          缩放
          <input id="scale" type="range" min="1" max="12" step="0.5" value="4" />
          <output id="scaleOut">4</output>
        </label>

        <label class="ctrl">
          拖尾
          <input id="fade" type="range" min="1" max="30" step="1" value="2" />
          <output id="fadeOut">2</output>
        </label>

        <button id="reseed">换个种子</button>
        <span class="hint">鼠标推开粒子</span>
      </div>

      <div class="toy-stage" id="stage"></div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
