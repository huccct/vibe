<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dce5da">
  <title>啪叽。甩墙上的一坨 · vibe</title>
  <link rel="icon" href="../../assets/logo.svg">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="../../src/shared/series.css">
</head>
<body>
  <main>
    <div id="stage" aria-label="软胶玩具的瓷砖墙">
      <p id="error" hidden>3D 场景没能启动。请换用支持 WebGL 的浏览器后刷新。</p>
    </div>
    <header>
      <a class="series-home" href="../../" aria-label="返回 vibe 合集">vibe</a>
      <div class="header-actions">
        <button id="sound" aria-pressed="false" aria-label="打开音效">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4Z"/><path class="sound-waves" d="M15 8c2 2 2 6 0 8m3-11c4 4 4 10 0 14"/><path class="sound-off" d="m16 9 5 6m0-6-5 6"/></svg>
        </button>
        <button id="reset" title="重新揉一坨（R）">重新揉</button>
      </div>
    </header>
    <div class="intro">
      <h1>啪叽<span>。</span></h1>
      <p>小时候，往墙上甩的那一坨。</p>
    </div>
    <div class="play-hint" aria-hidden="true">
      <span id="hint">抓住它，甩到墙上。</span>
      <span id="subhint">黏住、拉长，再慢慢掉下来。</span>
    </div>
    <output id="status" role="status" aria-live="polite">这次不会被骂。</output>
    <footer>
      <div class="controls">
        <fieldset class="colors">
          <legend class="sr-only">软胶颜色</legend>
          <button class="swatch selected" style="--swatch:#ef952b" data-color="#ed881d" aria-label="橘子汽水色" aria-pressed="true"></button>
          <button class="swatch" style="--swatch:#a2be50" data-color="#98bf37" aria-label="青苹果色" aria-pressed="false"></button>
          <button class="swatch" style="--swatch:#e598a3" data-color="#e687a0" aria-label="草莓牛奶色" aria-pressed="false"></button>
          <button class="swatch" style="--swatch:#84aec3" data-color="#6bafd0" aria-label="蓝苏打色" aria-pressed="false"></button>
        </fieldset>
        <label class="stickiness" for="sticky">黏糊度<input id="sticky" type="range" min="0" max="100" value="55"><output id="sticky-value" for="sticky">刚刚好</output></label>
        <button id="throw">帮我甩一下 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M6 5h13v13"/></svg></button>
      </div>
      <p class="keyboard-hint">鼠标 / 手指抓住甩 · 空格也能甩 · R 重新揉</p>
    </footer>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
