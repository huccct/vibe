<dialog id="sources"><form method="dialog"><button aria-label="关闭建模依据">×</button></form><p class="kicker">REFERENCE & SCALE</p><h2>重建依据</h2><p>塔体采用米制尺度，根据雷峰塔景区公布的尺寸与实景照片重建外观。</p><dl><dt>总高</dt><dd>71.679 m</dd><dt>台基对径</dt><dd>60 m</dd><dt>塔身对径</dt><dd>28 m</dd><dt>结构</dt><dd>五层 · 八角 · 铜瓦</dd></dl><p>山体采用公开高程数据，水岸采用 OpenStreetMap。屋面曲线、局部构件及植被按照片推定；不是激光扫描或测绘级模型。</p><a href="http://jing.leifengta.com/introduction.aspx?c_kind=4&c_kind2=16&c_kind3=22&c_kind4=34" target="_blank" rel="noopener">景区官方建筑资料 ↗</a><a href="./SOURCES.md" target="_blank">完整来源与精度说明 ↗</a></dialog>
