<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eeeee6">
  <meta name="description" content="给练鼓的自己：调速度、打重音、练细分。打开就能用的节拍器。">
  <title>拍点 · 练鼓节拍器 · vibe</title>
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="../../src/shared/series.css">
</head>
<body>
  <div class="shell">
    <header class="page-header">
      <a class="series-home" href="../../" aria-label="返回 vibe 合集"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h13"/></svg> vibe 合集</a>
      <span class="header-note">为每一次练习，打好底拍。</span>
    </header>

    <main>
      <div class="heading">
        <div><h1>拍点<span>。</span></h1><p>跟上节拍，慢慢来。</p></div>
        <div class="session"><span>本次练习</span><div><output id="elapsed" aria-label="累计练习时间">00:00</output><button id="reset-time" class="icon-button" aria-label="重置练习时间" title="重置练习时间"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg></button></div></div>
      </div>

      <div class="workspace">
        <section class="instrument" aria-label="节拍控制">
          <div class="instrument-top"><span class="instrument-name"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17V9m6 11V4m6 13V9m6 11V4"/></svg> DRUM METRONOME</span><span id="status" role="status">待开始</span></div>

          <div class="tempo-panel">
            <button id="slower" class="tempo-step" aria-label="速度减 1 BPM"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
            <div class="tempo-readout"><label for="bpm">速度 <span>BPM</span></label><input id="bpm" type="number" inputmode="numeric" min="30" max="300" step="1" value="80" aria-label="速度 BPM"><span id="tempo-word">从容一点</span></div>
            <button id="faster" class="tempo-step" aria-label="速度加 1 BPM"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
          </div>
          <div class="tempo-range"><input id="tempo-slider" type="range" min="30" max="300" value="80" aria-label="滑动调节速度"><div><span>30</span><span>300</span></div></div>

          <div class="beats-heading"><span id="meter-label">4/4 拍 · 四分音符为一拍</span><span>点击切换重音</span></div>
          <div id="beats" class="beats" aria-label="每拍重音设置"></div>
          <div class="beat-legend"><span><i class="accent-key"></i>重音</span><span><i class="normal-key"></i>普通</span><span><i class="mute-key"></i>静音</span></div>

          <div class="transport">
            <button id="play" class="play-button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7Z"/></svg><span>开始练习</span><kbd>空格</kbd></button>
            <button id="tap" class="tap-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v4M4.2 6.2 7 9M19.8 6.2 17 9M3 14h4m10 0h4M8 20l4-10 4 10"/></svg><span>敲击测速</span><small id="tap-note">TAP / 连点四下</small></button>
          </div>
          <p id="error" role="alert" hidden></p>
        </section>

        <aside class="settings" aria-label="练习设置">
          <h2>练习设置</h2>
          <div class="setting-block">
            <label for="meter">拍号</label>
            <select id="meter"><option value="4/4">4 / 4　常用四拍</option><option value="3/4">3 / 4　三拍</option><option value="2/4">2 / 4　两拍</option><option value="5/4">5 / 4　五拍</option><option value="6/8">6 / 8　六拍</option><option value="7/8">7 / 8　七拍</option></select>
          </div>
          <fieldset class="setting-block subdivision-block">
            <legend>节奏细分</legend>
            <div id="subdivisions" class="subdivision-options">
              <button data-division="1" aria-pressed="true" aria-label="每拍一下"><svg viewBox="0 0 44 28" aria-hidden="true"><circle cx="22" cy="14" r="4"/></svg><span>四分</span></button>
              <button data-division="2" aria-pressed="false" aria-label="每拍两下"><svg viewBox="0 0 44 28" aria-hidden="true"><circle cx="14" cy="14" r="4"/><circle cx="30" cy="14" r="3"/></svg><span>八分</span></button>
              <button data-division="3" aria-pressed="false" aria-label="每拍三下"><svg viewBox="0 0 44 28" aria-hidden="true"><circle cx="10" cy="14" r="4"/><circle cx="22" cy="14" r="3"/><circle cx="34" cy="14" r="3"/></svg><span>三连音</span></button>
              <button data-division="4" aria-pressed="false" aria-label="每拍四下"><svg viewBox="0 0 44 28" aria-hidden="true"><circle cx="7" cy="14" r="4"/><circle cx="17" cy="14" r="3"/><circle cx="27" cy="14" r="3"/><circle cx="37" cy="14" r="3"/></svg><span>十六分</span></button>
            </div>
            <p id="division-note">每拍 1 下，先把底拍练稳。</p>
          </fieldset>
          <div class="setting-block sound-row"><label for="sound">音色</label><select id="sound"><option value="wood">木鱼</option><option value="click">电子</option><option value="hat">闭镲</option></select></div>
          <div class="setting-block volume-block"><div><label for="volume">音量</label><output id="volume-value">70%</output></div><input id="volume" type="range" min="0" max="100" value="70" aria-label="音量"></div>
          <div class="practice-tip"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 19 14-14M5 5l14 14M3 21l4-4m10 0 4 4"/></svg><p>先求稳，再求快。<br><span>放松肩膀，让每一下都落在拍上。</span></p></div>
        </aside>
      </div>

      <section class="presets" aria-label="常用速度"><h2>从这个速度开始</h2><div><button data-bpm="60"><span>慢练</span><strong>60 <small>BPM</small></strong></button><button data-bpm="80"><span>基础</span><strong>80 <small>BPM</small></strong></button><button data-bpm="100"><span>稳拍</span><strong>100 <small>BPM</small></strong></button><button data-bpm="120"><span>提速</span><strong>120 <small>BPM</small></strong></button></div></section>
    </main>
    <footer><span>只管练习，设置会自动记住。</span><span><kbd>Space</kbd> 启停 <i>·</i> <kbd>T</kbd> 测速 <i>·</i> <kbd>↑ ↓</kbd> 调速</span></footer>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
